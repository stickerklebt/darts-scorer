# Darts Scorer im Container.
#   Lokal/LAN (HTTP):         docker compose up -d                → http://<rechner>:8080
#   Mit HTTPS (eigene Domain): DOMAIN=darts.example.de docker compose --profile https up -d
# HTTPS ist für iPhone/iPad wichtig: nur dann funktionieren Service Worker (Offline), „Zum Home-Bildschirm“
# als echte App und Secure-Cookies. Caddy holt das Zertifikat automatisch (Ports 80/443 müssen erreichbar sein).

name: darts

services:
  app:
    build: .
    image: darts-scorer:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 8080
      DATA_DIR: /data
      # Hinter Caddy: Client-IP/HTTPS aus den Proxy-Headern lesen. Ohne Proxy auf false lassen.
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - darts-data:/data              # SQLite-Datenbank (Nutzer, Spiele, Freunde) – überlebt Updates/Neustarts
    # Härtung: Dateisystem schreibgeschützt (außer /data und /tmp), keine Rechte-Ausweitung, keine Linux-Capabilities
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    stop_grace_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Optional: HTTPS-Reverse-Proxy mit automatischem Let's-Encrypt-Zertifikat
  caddy:
    profiles: ["https"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN setzen, z. B. darts.example.de}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  darts-data:
  caddy-data:
  caddy-config:
