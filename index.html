<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Darts">
<meta name="theme-color" content="#0b0a08">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<link rel="preload" href="fonts/league-gothic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/fell-sc.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/screens.css">
<link rel="stylesheet" href="css/fx.css">
<title>Darts</title>
</head>
<body>
<div id="app"></div>
<!-- Handgemacht: Filter für gezeichnete Linien (Feder wackelt leicht) und gedruckte Schrift (Bleisatz-Rauheit) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="rough" x="-4%" y="-4%" width="108%" height="108%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.8" xChannelSelector="R" yChannelSelector="G"/></filter>
  <filter id="rough-s" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" xChannelSelector="R" yChannelSelector="G"/></filter>
  <filter id="ink" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="1" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.8" xChannelSelector="R" yChannelSelector="G"/></filter>
</svg>
<script type="module" src="js/main.js"></script>
<script>
/* Als Datei geöffnet (file://) laden Firefox und Chrome keine ES-Module → statt schwarzem Bildschirm ein Hinweis. */
if (location.protocol === 'file:') setTimeout(function () {
  if (document.getElementById('app').childElementCount || document.querySelector('.splash')) return;
  var d = document.createElement('div');
  d.setAttribute('style', 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#0b0a08;color:#f3e9d2;font:18px/1.45 Georgia,serif;text-align:center');
  d.innerHTML = '<div style="max-width:460px;padding:26px 22px;border:2px solid #d4a63a;outline:1px solid #d4a63a;outline-offset:-8px;border-radius:10px">'
    + '<div style="color:#d4a63a;letter-spacing:.2em;font-size:13px;text-transform:uppercase">Darts Scorer</div>'
    + '<h1 style="margin:6px 0 12px;font-size:28px;font-weight:normal">Bitte nicht als Datei öffnen</h1>'
    + '<p style="margin:0 0 14px">Der Browser blockiert die App, wenn die <i>index.html</i> direkt per Doppelklick geöffnet wird.</p>'
    + '<p style="margin:0 0 18px">Online spielen:<br><a style="color:#ecc96a" href="https://stickerklebt.github.io/darts-scorer/">stickerklebt.github.io/darts-scorer</a></p>'
    + '<p style="margin:0;color:#a89d87;font-size:15px">Lokal auf dem Mac: im Ordner <i>Darts starten.command</i> doppelklicken.</p></div>';
  document.body.appendChild(d);
}, 1500);
</script>
</body>
</html>
