<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Darts">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<title>Darts</title>
<style>
:root{
  --bg:#000; --elev:#1c1c1e; --elev2:#2c2c2e; --elev3:#3a3a3c;
  --sep:rgba(84,84,88,.55);
  --label:#f5f5f7; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
  --accent:#30d158; --accent-soft:rgba(48,209,88,.14); --red:#ff453a;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  --sal:env(safe-area-inset-left); --sar:env(safe-area-inset-right);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--label);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;letter-spacing:-.01em}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.3;pointer-events:none}
input{font:inherit;color:var(--label);-webkit-user-select:text;user-select:text}
.num{font-variant-numeric:tabular-nums}
.ic{width:20px;height:20px;flex:none}

/* ---------- Liquid Glass ---------- */
.glass{
  background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05));
  -webkit-backdrop-filter:blur(28px) saturate(190%);backdrop-filter:blur(28px) saturate(190%);
  border:.5px solid rgba(255,255,255,.22);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.28),inset 0 -1px 1px rgba(255,255,255,.06),0 10px 30px rgba(0,0,0,.45);
}
.glass-accent{
  background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,0) 55%),var(--accent);
  color:#000;border:.5px solid rgba(255,255,255,.35);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.5),0 10px 30px rgba(48,209,88,.25);
}
.navbtn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--label);flex:none}
.navbtn:active,.cta:active{transform:scale(.94)}
.navbtn,.cta{transition:transform .15s}

/* ---------- Pages ---------- */
.page{max-width:680px;margin:0 auto;padding:calc(var(--sat) + 12px) calc(var(--sar) + 20px) calc(var(--sab) + 40px) calc(var(--sal) + 20px)}
.page.withbar{padding-bottom:calc(var(--sab) + 120px)}
.topnav{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:calc(var(--sat) + 8px) calc(var(--sar) + 16px) 8px calc(var(--sal) + 16px);max-width:720px;margin:0 auto;pointer-events:none}
.topnav>*{pointer-events:auto}
h1.lt{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:6px 0 4px}
.desc{color:var(--label2);font-size:15px;margin:0 0 6px;line-height:1.4}
.sh{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:32px 2px 12px}
.foot{color:var(--label2);font-size:13px;margin:8px 16px 0;line-height:1.4}
.list{background:var(--elev);border-radius:22px;overflow:hidden}
.cell{display:flex;align-items:center;gap:14px;width:100%;min-height:58px;padding:11px 16px;text-align:left;position:relative}
.cell+.cell::before{content:"";position:absolute;top:0;right:0;left:var(--inset,16px);height:.5px;background:var(--sep)}
button.cell:active{background:var(--elev2)}
.cell .ct{flex:1;min-width:0}
.cell .ct b{display:block;font-size:17px;font-weight:600;letter-spacing:-.02em}
.cell .ct small{display:block;color:var(--label2);font-size:14px;margin-top:2px}
.cell .chev{color:var(--label3)}
.tile{width:46px;height:46px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;letter-spacing:-.02em;
  background:linear-gradient(180deg,#3a3a3c,#232325);box-shadow:inset 0 .5px 0 rgba(255,255,255,.18)}
.games{--inset:76px}

/* Profil */
.profile{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;border-radius:24px;background:var(--elev);text-align:left;margin-top:14px}
.profile:active{background:var(--elev2)}
.avatar{width:58px;height:58px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:600;
  background:linear-gradient(180deg,#8e8e93,#48484a);color:#fff}
.profile .pn{font-size:22px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile .ps{color:var(--label2);font-size:14px;margin-top:2px}
.pavg{margin-left:auto;text-align:right;flex:none}
.pavg span{display:block;color:var(--label2);font-size:13px}
.pavg b{display:block;font-size:30px;font-weight:600;color:var(--accent);letter-spacing:-.02em;line-height:1.1}
.resume{display:flex;align-items:center;gap:12px;width:100%;margin-top:14px;padding:14px 16px;border-radius:22px;text-align:left}
.resume .ct b{font-size:16px}
.dotlive{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);flex:none}

/* Setup */
.prow{gap:12px;min-height:54px;padding:8px 10px 8px 16px}
.prow .ord{width:20px;color:var(--label2);font-weight:500;text-align:center}
.prow input{flex:1;min-width:0;background:transparent;border:0;outline:none;font-size:17px;padding:8px 0}
.prow .mainname{flex:1;font-size:17px;font-weight:600}
.badge{font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:4px 9px;border-radius:999px}
.iconbtn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--label2);background:var(--elev2);flex:none}
.iconbtn:active{background:var(--elev3)}
.iconbtn.del{color:var(--red)}
.linkrow{display:flex;gap:10px;margin-top:10px}
.linkrow button{flex:1;height:46px;border-radius:999px;background:var(--elev);display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:600;color:var(--accent)}
.linkrow button:active{background:var(--elev2)}
.optrow{display:flex;flex-direction:column;gap:10px;padding:14px 16px}
.optrow>span{font-size:15px;color:var(--label2)}
.seg{display:flex;background:rgba(118,118,128,.24);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;height:34px;border-radius:999px;font-size:15px;font-weight:500;color:var(--label);transition:background .2s}
.seg button.on{background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.14));box-shadow:inset 0 .5px 0 rgba(255,255,255,.45),0 2px 8px rgba(0,0,0,.3);font-weight:600}
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:20px calc(var(--sar) + 20px) calc(var(--sab) + 14px) calc(var(--sal) + 20px);
  background:linear-gradient(to top,rgba(0,0,0,.92) 45%,rgba(0,0,0,0))}
.cta{display:block;width:100%;max-width:640px;margin:0 auto;height:56px;border-radius:999px;font-size:17px;font-weight:600}
.cta.plain{color:var(--label)}

/* Onboarding */
.onboard{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(var(--sat) + 30px) 28px calc(var(--sab) + 30px);max-width:460px;margin:0 auto}
.appicon{width:108px;height:108px;border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 .5px rgba(255,255,255,.15)}
.onboard h1{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:28px 0 8px}
.onboard p{color:var(--label2);font-size:17px;line-height:1.45;margin:0 0 30px}
.field{width:100%;height:56px;border-radius:16px;background:var(--elev);border:0;outline:none;padding:0 18px;font-size:19px;text-align:center;margin-bottom:14px}
.field:focus{box-shadow:0 0 0 2px var(--accent)}

/* ---------- Spiel ---------- */
.game{height:100dvh;display:flex;flex-direction:column;gap:10px;
  padding:calc(var(--sat) + 6px) calc(var(--sar) + 12px) calc(var(--sab) + 12px) calc(var(--sal) + 12px);
  background:radial-gradient(90% 45% at 50% -5%,rgba(255,255,255,.09),transparent 70%),#000}
.gtop{display:flex;align-items:center;gap:10px;flex:none}
.gtitle{flex:1;text-align:center;line-height:1.2}
.gtitle b{display:block;font-size:17px;font-weight:600}
.gtitle span{font-size:13px;color:var(--label2)}
.gmain{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.gleft{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.duo{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo.solo{grid-template-columns:1fr}
.card{background:var(--elev);border-radius:24px;padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;min-height:0;transition:background .2s,box-shadow .2s}
.card.on{background:var(--elev2);box-shadow:inset 0 0 0 2px var(--accent)}
.cname{font-size:17px;font-weight:600;display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.throw{width:7px;height:7px;border-radius:50%;background:var(--label);flex:none;opacity:.9}
.on .throw{background:var(--accent)}
.sl{font-size:13px;color:var(--label2);margin-top:3px}
.sl b{color:var(--label);font-weight:600}
.big{font-size:clamp(52px,16vw,128px);font-weight:600;letter-spacing:-.04em;line-height:1;text-align:center}
.cmeta{display:flex;justify-content:space-between;gap:6px;font-size:13px;color:var(--label2)}
.cmeta b{color:var(--label);font-weight:600}
.rows{flex:1;min-height:0;display:flex;flex-direction:column;gap:5px;overflow:auto}
.row{flex:1 1 0;min-height:42px;max-height:120px;background:var(--elev);border-radius:18px;display:flex;align-items:center;gap:12px;padding:0 18px;transition:background .2s,box-shadow .2s}
.row.on{background:var(--elev2);box-shadow:inset 0 0 0 2px var(--accent)}
.row .nm{flex:1;min-width:0}
.row .rn{display:flex;align-items:center;gap:7px;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm small{display:block;color:var(--label2);font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm small b{color:var(--label);font-weight:600}
.row .sc{font-size:clamp(26px,5.4dvh,58px);font-weight:600;letter-spacing:-.03em}
.hint{flex:none;height:42px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;color:var(--label2);border-radius:999px;background:var(--elev)}
.hint b{color:var(--label);font-weight:600}
.chip{color:var(--accent);background:var(--accent-soft);padding:4px 11px;border-radius:999px;font-weight:600}
.target{font-size:15px}
.target b{color:var(--accent);font-size:20px}

.pad{flex:none;display:flex;flex-direction:column;gap:8px}
.entry{display:flex;align-items:baseline;justify-content:space-between;padding:0 6px;gap:10px}
.entry .who{color:var(--label2);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .v{font-size:44px;font-weight:300;letter-spacing:-.03em;line-height:1.1}
.entry .v.empty{color:var(--label3)}
.quick{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:1 1 0;min-width:33px;height:36px;padding:0 2px;border-radius:999px;background:var(--elev);font-size:15px;font-weight:500}
.quick button:active{background:var(--elev3)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys.four{grid-template-columns:repeat(4,1fr)}
.key{height:clamp(50px,7.4dvh,78px);border-radius:18px;background:var(--elev);font-size:28px;font-weight:400;display:flex;align-items:center;justify-content:center;transition:background .1s}
.key:active{background:var(--elev3)}
.key.ok{font-size:19px;font-weight:600;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,0) 55%),var(--accent);color:#000}
.key.ok:active{filter:brightness(1.15)}
.key.wide{grid-column:span 4}
.key .ic{width:26px;height:26px}

@media (min-width:820px) and (orientation:landscape){
  .gmain{flex-direction:row;gap:16px}
  .pad{flex:0 0 min(44%,520px);justify-content:flex-end}
  .key{height:clamp(56px,10.5dvh,100px);font-size:32px}
  .quick button{height:44px;font-size:16px}
  .big{font-size:clamp(70px,11vw,160px)}
}
@media (min-width:700px) and (orientation:portrait){
  .big{font-size:clamp(90px,15vw,180px)}
  .key{height:clamp(62px,7.2dvh,92px);font-size:32px}
  .cname{font-size:22px}
  .cmeta,.sl{font-size:15px}
  .row .nm b{font-size:21px}
}

/* Ergebnis */
.trophy{text-align:center;margin:30px 0 8px}
.trophy .t{width:84px;height:84px;margin:0 auto 16px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.trophy .t .ic{width:40px;height:40px}
.trophy h1{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:0 0 6px}
.trophy p{margin:0;color:var(--label2);font-size:17px}
.rank{--inset:58px}
.rank .pos{width:28px;height:28px;border-radius:50%;background:var(--elev2);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex:none}
.rank .pos.first{background:var(--accent);color:#000}
.rank .val{font-size:22px;font-weight:600}
.tablewrap{background:var(--elev);border-radius:22px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:12px 16px;text-align:right;white-space:nowrap}
tr+tr td{border-top:.5px solid var(--sep)}
th{font-weight:600;padding-top:16px}
th:first-child,td:first-child{text-align:left;color:var(--label2);font-weight:400}
th.win{color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:28px}

/* Sheets */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease-out}
@media (min-width:700px){.scrim{align-items:center}}
.sheet{width:calc(100% - 16px);max-width:460px;margin:0 8px calc(var(--sab) + 8px);border-radius:36px;padding:22px 18px 18px;
  background:linear-gradient(180deg,rgba(58,58,62,.82),rgba(36,36,40,.86));
  -webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);
  border:.5px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 1px rgba(255,255,255,.22),0 30px 80px rgba(0,0,0,.6);
  animation:up .32s cubic-bezier(.2,.9,.3,1)}
.sheet h3{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:2px 4px 6px;text-align:center}
.sheet p{color:var(--label2);text-align:center;margin:0 6px 18px;font-size:15px;line-height:1.4}
.sheet .list{background:rgba(255,255,255,.07);margin-bottom:14px}
.sheet .cell{min-height:52px}
.sheet .cell .lbl{flex:1;font-size:17px}
.sheet .cell .val{color:var(--label2);font-size:17px}
.sheet .btns{display:flex;gap:10px}
.sheet .btns button{flex:1;height:54px;border-radius:999px;font-size:17px;font-weight:600}
.sheet .btns .neutral{background:rgba(255,255,255,.1)}
.sheet .btns .danger{background:rgba(255,69,58,.18);color:var(--red)}
.sheet .field{background:rgba(255,255,255,.08)}
.darts3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.darts3 button{height:64px;border-radius:20px;background:rgba(255,255,255,.1);font-size:26px;font-weight:500}
.darts3 button.glass-accent{font-weight:600}
.textbtn{display:block;width:100%;height:44px;color:var(--label2);font-size:16px}
.switch{width:51px;height:31px;border-radius:999px;background:rgba(120,120,128,.32);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.25);transition:transform .2s}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(20px)}

.toast{position:fixed;left:50%;top:calc(var(--sat) + 64px);transform:translateX(-50%);z-index:60;padding:12px 20px;border-radius:999px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;white-space:nowrap;animation:pop .25s ease-out;
  background:rgba(40,40,44,.75)}
.toast i{width:8px;height:8px;border-radius:50%;background:var(--red)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-8px) scale(.96)}}
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
