# Darts Scorer hinter nginx. Kein TLS und keine Domain hier: ein weiterer Reverse Proxy davor macht HTTPS
# und reicht X-Forwarded-Proto/-For/-Host weiter. Node lauscht nur auf 127.0.0.1:8080.
# install.sh legt die Datei als /etc/nginx/conf.d/darts.conf ab (innerhalb von http { }).

# Header des äußeren Proxys durchreichen; fehlen sie (Direktzugriff), die eigenen Werte nehmen.
map $http_x_forwarded_proto $darts_fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
map $http_x_forwarded_host $darts_fwd_host {
    default $http_x_forwarded_host;
    ""      $http_host;
}

# Request-ID: vom äußeren Proxy übernehmen, sonst die eigene von nginx → steht in den Logs der App (Feld rid)
map $http_x_request_id $darts_rid {
    default $http_x_request_id;
    ""      $request_id;
}

upstream darts_app {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Sync großer Spielhistorien (passend zu maxBodyBytes in server/src/config.js)
    client_max_body_size 20m;

    location / {
        proxy_pass http://darts_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        # Client-IP: Kette des äußeren Proxys + dessen Adresse anhängen (Node nimmt den ersten Eintrag)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # HTTPS-Info vom äußeren Proxy → Secure-Cookies und HSTS in der App
        proxy_set_header X-Forwarded-Proto $darts_fwd_proto;
        proxy_set_header X-Forwarded-Host $darts_fwd_host;
        proxy_set_header X-Request-Id $darts_rid;
        proxy_read_timeout 60s;
    }
}
